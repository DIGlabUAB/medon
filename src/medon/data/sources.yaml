      Change Control Plan for Artificial Intelligence-Enabled Device Software Functions. Guidance for
      Industry and FDA Staff. 2024. https://www.fda.gov/media/166704/download
  chairag:
    name: CHAI Responsible AI Guide
    short: CHAI Responsible AI Guide
    document: Responsible AI Guide
    date: see source
    url: https://assets.ctfassets.net/7s4afyr9pmov/6e7PrdrsNTQ5FjZ4uyRjTW/c4070131c523d4e1db26105aa51f087d/CHAI_Responsible-AI-Guide.pdf
    cite: Coalition for Health AI. Responsible AI Guide. https://assets.ctfassets.net/7s4afyr9pmov/6e7PrdrsNTQ5FjZ4uyRjTW/c4070131c523d4e1db26105aa51f087d/CHAI_Responsible-AI-Guide.pdf
  chaiasg:
    name: CHAI Assurance Standards Guide
    short: CHAI Assurance Standards
    document: Assurance Standards Guide (draft)
    date: 2024-06 draft
    url: https://www.chai.org/blog/chai-releases-draft-responsible-health-ai-framework-for-public-comment
    cite: Coalition for Health AI. Assurance Standards Guide (draft for public comment, June 2024). https://www.chai.org/blog/chai-releases-draft-responsible-health-ai-framework-for-public-comment
  chaiamc:
    name: CHAI Applied Model Card
    short: CHAI Applied Model Card
    document: Applied Model Card documentation v0.1
    date: v0.1
    url: https://registry.chai.org/applied-model-card
