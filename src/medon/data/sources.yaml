    short: JC and CHAI RUAIH
    document: Responsible Use of AI in Healthcare guidance
    date: '2025-09-17'
    url: https://digitalassets.jointcommission.org/api/public/content/dcfcf4f1a0cc45cdb526b3cb034c68c2
