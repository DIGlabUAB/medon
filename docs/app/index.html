<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medon planner</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--soft:#f7f8fa;--fg:#16191d;--mut:#5d6570;--line:#e3e6ea;--cu:#c4501a;--tint:rgba(196,80,26,.08);
--low:#2c8a6e;--mod:#c98a12;--high:#c2462b;--sans:'Inter Tight',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
header{background:#fff;color:var(--fg);padding:0 20px;height:54px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
header svg.lg{width:24px;height:24px;flex:none}header b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.prog{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;max-width:520px;margin-left:12px}.prog i{display:block;height:100%;width:0;background:var(--cu);transition:width .5s cubic-bezier(.3,.7,.2,1)}
.pill{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px;border:1px solid var(--line);margin-left:auto;white-space:nowrap}
.pill[data-t=low]{background:#cfe8d6;color:#0d3b1e;border-color:transparent}.pill[data-t=moderate]{background:#f6e2a8;color:#4a3600;border-color:transparent}.pill[data-t=high]{background:#f3c3b3;color:#5a1a08;border-color:transparent}
.rs{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;font:12px var(--sans);padding:5px 12px;cursor:pointer}.rs:hover{border-color:var(--cu)}
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,.95fr);gap:0;height:calc(100% - 54px)}
#stage{padding:34px 40px;overflow:auto;position:relative}
#prof{border-left:1px solid var(--line);background:var(--soft);padding:22px 24px;overflow:auto}
.crumb{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cu);margin-bottom:14px;display:flex;gap:10px}.crumb span{color:var(--mut)}
h2{font-weight:500;font-size:clamp(22px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px;max-width:640px}
.why{color:var(--mut);margin:0 0 26px;max-width:560px;font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-width:760px}
.tile{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 16px 16px;cursor:pointer;min-height:92px;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;animation:rise .45s both}
.tile:hover{border-color:var(--cu);box-shadow:0 6px 18px -12px rgba(16,24,40,.25)}
.tile:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
.tile[aria-pressed=true]{background:var(--tint);border-color:var(--cu)}
.tile .k{position:absolute;top:10px;right:12px;font:11px var(--mono);color:var(--mut);opacity:.7}
.tile b{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em;padding-right:18px}.tile small{display:block;color:var(--mut);margin-top:5px;font-size:13px;line-height:1.35}
.tile.ns{background:transparent;border-style:dashed;min-height:64px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nav{display:flex;gap:10px;margin-top:26px;align-items:center}
.btn{font:500 14px var(--sans);padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--cu)}.btn.p{background:var(--cu);border-color:var(--cu);color:#fff}.btn.p:hover{filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:default}
.fld{display:block;margin:0 0 16px;max-width:460px}.fld span{display:block;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit}.fld input:focus{outline:2px solid var(--cu)}
.rows{max-width:820px;display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rise .4s both}
.row p{margin:0;font-size:14.5px}.row .ids{font:11px var(--mono);color:var(--mut);margin-top:3px}
.seg{display:flex;gap:4px}.seg button{font:500 12.5px var(--sans);padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button:hover{border-color:var(--cu)}.seg button[aria-pressed=true]{background:var(--cu);border-color:var(--cu);color:#fff}
/* profile */
.ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}.lab{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.tierword{font-weight:500;font-size:44px;letter-spacing:-.04em;line-height:1;text-transform:capitalize;transition:color .4s}.tierword[data-t=low]{color:var(--low)}.tierword[data-t=moderate]{color:var(--mod)}.tierword[data-t=high]{color:var(--high)}
.meter{display:flex;gap:4px;margin:10px 0 4px}.meter i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .4s}.meter i.on[data-t=low]{background:var(--low)}.meter i.on[data-t=moderate]{background:var(--mod)}.meter i.on[data-t=high]{background:var(--high)}
.sub{font-size:13px;color:var(--mut);min-height:20px}
.radar{display:block;margin:6px auto 0;max-width:420px;width:100%}
.drv{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.drv span{font:11.5px var(--mono);padding:4px 9px;border-radius:999px;background:var(--tint);border:1px solid transparent;animation:rise .35s both}
.cnt{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px}.cnt b{font-size:30px;font-weight:500;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.pt{font:inherit;color:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--cu);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:64px;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transition:opacity .3s,transform .3s}
.pt:hover{border-color:var(--cu)}.pt.out{opacity:0;transform:scale(.8)}.pt .i{font:500 10.5px var(--mono);color:var(--cu);display:block}.pt .t{font-size:12px;line-height:1.25;display:block;margin-top:2px}
.pt[data-s=done]{border-left-color:var(--low)}.pt[data-s="in progress"]{border-left-color:var(--mod)}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
.phase{grid-column:1/-1;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:8px}
/* results */
.sum{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 22px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:120px}.sum b{display:block;font-size:26px;font-weight:500;letter-spacing:-.03em}.sum span{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.chip{font:12px var(--mono);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.ck{max-width:880px}.ci{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden;animation:rise .35s both}
.ci summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}.ci summary::-webkit-details-marker{display:none}
.ci input{width:18px;height:18px;accent-color:var(--cu)}.ci .id{font:500 11px var(--mono);color:var(--cu);margin-right:8px}.ci .tt{font-weight:600}
.ci .st{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;color:#1c1c1a}.st.done{background:#cfe8d6}.st.inprogress{background:#f6e2a8}.st.open{background:#f3c3b3}
.ci .bd{padding:2px 16px 16px 44px;font-size:14px;color:var(--mut)}.ci .bd p{margin:6px 0}.ci .bd b{color:var(--fg);font-weight:600}.ci blockquote{margin:6px 0;padding:6px 12px;border-left:2px solid var(--line);font-size:13px}
.refs{max-width:880px;margin-top:30px;font-size:13px;color:var(--mut)}.refs h3{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cu)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);max-width:560px;width:calc(100% - 32px);padding:22px 24px}dialog::backdrop{background:rgba(16,24,40,.35)}
dialog h4{margin:0 0 10px;font-size:20px;font-weight:600;letter-spacing:-.01em}dialog p{margin:8px 0;font-size:14px;color:var(--mut)}dialog b{color:var(--fg)}
.note{font-size:12px;color:var(--mut);max-width:620px;margin-top:26px;border-left:2px solid var(--cu);padding-left:10px}
.crumb,.lab,.fld span,.phase,.pill,.sum span,.refs h3,.ci .st,.chip{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12.5px}.crumb span{font-weight:400}
.pt .i,.ci .id,.tile .k{font-family:var(--sans)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}#prof{border-left:0;border-top:1px solid var(--line)}#stage{padding:24px 18px}html,body{height:auto}.prog{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,#prof,.nav,.dl,.bar,.rs{display:none!important}main{display:block;height:auto}#stage{padding:0;overflow:visible}.ci{break-inside:avoid}.ci .bd{display:block}details:not([open])>.bd{display:block}body{background:#fff;color:#000}}
</style></head><body>

s multi step actions"}, {"value": "rules", "label": "Rules or scoring system"}]}, {"id": "source", "why": "Third party tools add vendor validation, data terms and change notice items.", "section": "tool", "text": "Where does the tool come from?", "type": "single", "options": [{"value": "vendor_product", "label": "Vendor product"}, {"value": "vendor_embedded", "label": "Vendor feature embedded in the EHR or another system"}, {"value": "foundation_model_api", "label": "Built by us on a third party model or API"}, {"value": "open_source", "label": "Open source model we adopted"}, {"value": "academic_transfer", "label": "Model transferred from another institution or study"}, {"value": "in_house", "label": "Built in house"}]}, {"id": "users", "why": "Patients as direct users raise the tier and add transparency items.", "section": "use", "text": "Who uses or sees the output?", "type": "multi", "options": [{"value": "clinicians", "label": "Physicians or advanced practice providers"}, {"value": "nurses", "label": "Nurses or allied health"}, {"value": "staff", "label": "Administrative or operations staff"}, {"value": "patients", "label": "Patients or families"}]}, {"id": "affects_care", "why": "Whether the output can change care or access to care.", "section": "use", "text": "Can the output change a patient's care, or access to care?", "type": "single", "options": [{"value": "yes", "label": "Yes"}, {"value": "no", "label": "No"}]}, {"id": "patient_level", "why": "Outputs about individual patients add validation and subgroup checks.", "section": "use", "text": "Does it produce outputs about individual patients?", "type": "single", "options": [{"value": "yes", "label": "Yes"}, {"value": "no", "label": "No"}]}, {"id": "harm", "why": "Worst plausible harm if the output is wrong. Serious harm sets the tier to high.", "section": "use", "text": "If the output is wrong, what is the worst plausible harm?", "type": "single", "options": [{"value": "minimal", "label": "Inconvenience or "section": "existing", "type": "status", "text": "Performance was validated on local data with domain experts."}, {"id": "x_subgroup", "section": "existing", "type": "status", "text": "Performance was checked across the populations served."}, {"id": "x_dua", "section": "existing", "type": "status", "text": "The vendor agreement covers data use, re-identification, security and audit rights."}, {"id": "x_third_party", "section": "existing", "type": "status", "text": "Third party risk and a contingency for vendor failure are addressed."}, {"id": "x_disclosure", "section": "existing", "type": "status", "text": "Patients are told about the tool and consent is handled where relevant."}, {"id": "x_training", "section": "existing", "type": "status", "text": "Role specific training and access rules are defined."}, {"id": "x_oversight", "section": "existing", "type": "status", "text": "Human oversight and override roles are defined."}, {"id": "x_monitoring", "section": "existing", "type": "status", "text": "A monitoring plan names metrics, owners and frequency."}, {"id": "x_vendor_notice", "section": "existing", "type": "status", "text": "The vendor must notify us of model changes and we revalidate after them."}, {"id": "x_feedback", "section": "existing", "type": "status", "text": "Users have a channel to report problems and appeal outputs."}, {"id": "x_incident", "section": "existing", "type": "status", "text": "Adverse events and errors go to leadership, vendors and an incident system."}, {"id": "x_external", "section": "existing", "type": "status", "text": "There is a route for confidential external reporting of safety events."}, {"id": "x_suspend", "section": "existing", "type": "status", "text": "Criteria and a mechanism exist to suspend or deactivate the tool."}, {"id": "x_decommission", "section": "existing", "type": "status", "text": "A decommissioning plan exists."}, {"id": "x_board", "section": "existing", "type": "status", "text": "The governing board receives regular reports on AI use and outcomes."}, {"id": "x_workload", "section": "existing", "type": "status", "text": "Clinician workload from the tool is measured."}, {"id": "x_plan_review", "section": "existing", "type": "status", "text": "This governance plan is reviewed on a schedule."}, {"id": "x_modelcard", "section": "existing", "type": "status", "text": "A model card or equivalent fact sheet exists for this tool."}, {"id": "x_workflow", "section": "existing", "type": "status", "text": "Workflow fit and usability were assessed with real users."}, {"id": "x_fairness", "section": "existing", "type": "status", "text": "Fairness was defined and subgroups at risk were listed."}, {"id": "x_silent", "section": "existing", "type": "status", "text": "A silent prospective evaluation was run before go live."}, {"id": "x_pilot", "section": "existing", "type": "status", "text": "The tool was piloted with set success criteria before scale up."}, {"id": "x_override", "section": "existing", "type": "status", "text": "User overrides are recorded and reviewed."}, {"id": "x_auditlog", "section": "existing", "type": "status", "text": "Access is limited and audit logs are reviewed."}, {"id": "x_drift", "section": "existing", "type": "status", "text": "Drift is tracked with set triggers for revalidation."}, {"id": "x_independent", "section": "existing", "type": "status", "text": "An independent party reviewed the tool and its monitoring."}]}, "tiering": {"derived": {"third_party": {"q": "source", "in": ["vendor_product", "vendor_embedded", "foundation_model_api", "open_source", "academic_transfer"]}, "vendor_supplied": {"q": "source", "in": ["vendor_product", "vendor_embedded"]}, "patient_facing": {"q": "users", "has": "patients"}, "uses_phi": {"q": "phi", "eq": "identifiable"}, "changes_over_time": {"q": "updates", "in": ["vendor_updates", "local_retrain", "continuous"]}, "generative_or_agentic": {"q": "model_type", "in": ["generative", "agentic"]}}, "tiers": [{"id": "high", "when": {"any": [{"q": "function", "in": ["diagnostic", "treatment"]}, {"q": "harm", "eq": "serious"}, {"q": "autonomy", "eq": "acts_without_review"}, {"all": [{"q": "autonomy", "eq": "acts_with_review"}, {"q": "affects_care", "eq": "yes"}]}]}}, {"id": "moderate", "when": {"any": [{"q": "function", "in": ["clinical_support", "clinical_info"]}, {"q": "affects_care", "eq": "yes"}, {"d": "patient_facing"}, {"q": "harm", "eq": "moderate"}, {"all": [{"d": "generative_or_agentic"}, {"q": "patient_level", "eq": "yes"}]}]}}, {"id": "low", "when": {}}], "profile": [{"id": "proximity", "label": "Clinical proximity", "q": "function", "scores": {"administrative": 0, "operational": 1, "clinical_info": 1, "clinical_support": 2, "diagnostic": 3, "treatment": 3}}, {"id": "autonomy", "label": "Autonomy", "q": "autonomy", "scores": {"informs": 0, "recommends": 1, "acts_with_review": 2, "acts_without_review": 3}}, {"id": "harm", "label": "Harm severity", "q": "harm", "scores": {"minimal": 0, "moderate": 2, "serious": 3}}, {"id": "thirdparty", "label": "Third party reliance", "q": "source", "scores": {"in_house": 0, "open_source": 1, "academic_transfer": 1, "foundation_model_api": 2, "vendor_embedded": 3, "vendor_product": 3}}, {"id": "change", "label": "Change over time", "q": "updates", "scores": {"fixed": 0, "local_retrain": 2, "vendor_updates": 2, "continuous": 3}}, {"id": "data", "label": "Data sensitivity", "q": "phi", "scores": {"none": 0, "deidentified": 1, "identifiable": 3}}]}, "items": {"phases": [{"id": "govern", "title": "Governance and accountability"}, {"id": "predeploy", "title": "Before deployment"}, {"id": "operate", "title": "After go live"}, {"id": "retire", "title": "Change and retirement"}], "items": [{"id": "G01", "phase": "govern", "title": "Name an accountable owner for the tool", "action": "Assign one named role as accountable for the tool across its life. Document who decides on risk and who runs day to day oversight.", "evidence": "Owner named in the AI inventory entry.", "owner": "governance_lead", "sources": ["N03", "N04", "J01", "J09", "E07", "W04", "I01", "I02", "R18", "R21", "R22"], "min_tier": "low", "status_q": "x_owner"}, {"id": "G02", "phase": "govern", "title": "Review the tool in a multidisciplinary governance group", "action": "Present the tool to a group that spans clinical, safety, IT, privacy, compliance and executive roles. Record the decision and conditions.", "evidence": "Committee minutes or approval record.", "owner": "governance_lead", "sources": ["J01", "J02", "N03", "I01", "R07", "R14", "R21", "A13"], "min_tier": "low", "status_q": "x_committee"}, {"id": "G03", "phase": "govern", "title": "Report use, outcomes and adverse events to the governing board", "action": "Include the tool in the regular board report on AI use, outcomes and adverse events.", "evidence": "Board report that lists the tool.", "owner": "governance_lead", "sources": ["J02"], "min_tier": "moderate", "status_q": "x_board", "cadence": "board_report"}, {"id": "P01", "phase": "predeploy", "title": "Document intended use and limits", "action": "Write the intended use, intended users, target population and out of scope uses. State the performance the tool is meant to deliver in this setting.", "evidence": "Intended use statement or model card on file.", "owner": "clinical_owner", "sources": ["N10", "N11", "J10", "E04", "H01", "W03", "R01", "R05", "R12", "M02"], "min_tier": "low", "status_q": "x_intended_use"}, {"id": "P02", "phase": "predeploy", "title": "Identify and document risks and biases", "action": "List prospective risks and biases with emphasis on safety and access. Record the mitigations and the residual risk accepted.", "evidence": "Risk register entry.", "owner": "quality_safety_lead", "sources": ["J10", "N10", "E01", "H02", "I03", "R03", "R07", "R10", "M03"], "min_tier": "low", "status_q": "x_risk"}, {"id": "P03", "phase": "predeploy", "title": "Obtain and review vendor validation evidence", "action": "Ask the vendor how the tool was validated and tested. Ask whether the vendor will tune or validate on a sample that represents your patients. Ask how bias was evaluated.", "evidence": "Completed vendor questionnaire and reviewer notes.", "owner": "vendor_manager", "applies": {"d": "third_party"}, "sources": ["J04", "E04", "H01", "R04", "A05", "M05"], "min_tier": "low", "status_q": "x_vendor_validation"}, {"id": "P04", "phase": "predeploy", "title": "Validate performance on local data with domain experts", "action": "Test the tool in the deployment context with clinical domain experts. Tune or test on local data. Record measured performance against intended use.", "evidence": "Local validation report.", "owner": "clinical_owner", "applies": {"any": [{"q": "affects_care", "eq": "yes"}, {"q": "patient_level", "eq": "yes"}, {"q": "harm", "in": ["moderate", "serious"]}]}, "sources": ["N11", "J11", "E06", "W02", "I04", "R08", "R16", "R17", "A01", "M06", "M08"], "min_tier": "moderate", "status_q": "x_local_validation"}, {"id": "P05", "phase": "predeploy", "title": "Check performance across the populations served", "action": "Confirm that testing covers the populations you serve. Report performance by relevant subgroups before go live.", "evidence": "Subgroup performance table.", "owner": "quality_safety_lead", "applies": {"any": [{"q": "patient_level", "eq": "yes"}, {"q": "affects_care", "eq": "yes"}]}, "sources": ["N09", "J11", "E02", "W05", "I03", "R16", "A02", "A04", "M07"], "min_tier": "moderate", "status_q": "x_subgroup"}, {"id": "P06", "phase": "predeploy", "title": "Set data terms in the vendor agreement", "action": "Define permitted data uses. Prohibit re-identification. Require security compliance. Reserve audit rights with penalties.", "evidence": "Executed agreement with the listed terms.", "owner": "privacy_officer", "applies": {"all": [{"d": "third_party"}, {"q": "phi", "in": ["identifiable", "deidentified"]}]}, "sources": ["J03", "E02", "H04", "I05", "R15", "A03"], "min_tier": "low", "status_q": "x_dua"}, {"id": "P07", "phase": "predeploy", "title": "Address third party risk and plan for vendor failure", "action": "Apply your third party AI risk policy. Write a contingency for failure or incident in the vendor tool, model or data. Document the risk controls applied.", "evidence": "Third party risk assessment and contingency note.", "owner": "vendor_manager", "applies": {"d": "third_party"}, "sources": ["N06", "N14", "I08", "R04", "R06", "A05"], "min_tier": "low", "status_q": "x_third_party"}, {"id": "P08", "phase": "predeploy", "title": "Protect patient data and set patient transparency", "action": "Protect patient data from unauthorized use or release. Where the tool directly affects care, notify patients and families, explain how their data are used, and obtain consent where relevant. Address transparency for staff.", "evidence": "Disclosure text, consent workflow and privacy review.", "owner": "privacy_officer", "applies": {"any": [{"d": "patient_facing"}, {"q": "affects_care", "eq": "yes"}, {"d": "uses_phi"}]}, "sources": ["J13", "H04", "W01", "W03", "I06", "R06", "R15", "A10", "M09"], "min_tier": "low", "status_q": "x_disclosure"}, {"id": "P09", "phase": "predeploy", "title": "Define who may use the tool and train them", "action": "Define which roles may use the tool. Decide whether training is needed before rollout and whether it must recur. Provide role specific documentation.", "evidence": "Access rules and training record.", "owner": "training_lead", "applies": {"q": "users", "has_any": ["clinicians", "nurses", "staff"]}, "sources": ["J12", "E08", "I06", "I07", "R02", "R18", "R21", "A13"], "min_tier": "low", "status_q": "x_training", "cadence": "training"}, {"id": "P10", "phase": "predeploy", "title": "Define human oversight and override", "action": "Define the roles of people and the AI configuration. Specify who can override or disengage the tool and how an override is recorded.", "evidence": "Oversight procedure and override log design.", "owner": "clinical_owner", "applies": {"q": "autonomy", "in": ["recommends", "acts_with_review", "acts_without_review"]}, "sources": ["N04", "N15", "E05", "W01", "I07", "R09", "A06", "A14"], "min_tier": "moderate", "status_q": "x_oversight"}, {"id": "P11", "phase": "predeploy", "title": "Publish a model card for the tool", "action": "Complete a one page model card: intended use and users, population, warnings, model and data facts, key metrics for usefulness, fairness and safety, and references. Keep it current.", "evidence": "Model card in the AI inventory entry, with version and date.", "owner": "clinical_owner", "min_tier": "moderate", "status_q": "x_modelcard", "sources": ["R05", "R12", "A03", "A14", "M01", "M02", "M03", "M04", "M05", "M06", "M07", "M08", "M09"]}, {"id": "P12", "phase": "predeploy", "title": "Assess workflow fit and usability", "action": "Map where the tool enters the workflow. Test usability with real users. Record the benefit, risk and cost case against the current process.", "evidence": "Workflow map, usability findings and the benefit risk cost summary.", "owner": "clinical_owner", "min_tier": "moderate", "status_q": "x_workflow", "sources": ["R01", "R02", "R08"]}, {"id": "P13", "phase": "predeploy", "title": "Set the fairness approach and subgroups at risk", "action": "Define fairness for this use case. List the subgroups at risk. Set how bias will be tested before and after go live. Justify any protected attribute used.", "evidence": "Fairness definition, subgroup list and bias monitoring strategy.", "owner": "quality_safety_lead", "applies": {"q": "patient_level", "eq": "yes"}, "min_tier": "moderate", "status_q": "x_fairness", "sources": ["R03", "A02", "M04"]}, {"id": "P14", "phase": "predeploy", "title": "Run a silent prospective evaluation", "action": "Run the tool in the background on live data without showing outputs. Compare against outcomes and subgroups. Approve go live only after review.", "evidence": "Silent run report and approval record.", "owner": "quality_safety_lead", "min_tier": "high", "status_q": "x_silent", "sources": ["R17", "A04"]}, {"id": "P15", "phase": "predeploy", "title": "Pilot before scale and set go or no go criteria", "action": "Start with one site or team. Set success criteria for accuracy, reliability, acceptance, cost and workload. Update the risk plan from pilot findings.", "evidence": "Pilot plan, success criteria and the scale up decision.", "owner": "clinical_owner", "applies": {"q": "affects_care", "eq": "yes"}, "min_tier": "moderate", "status_q": "x_pilot", "sources": ["R19"]}, {"id": "O01", "phase": "operate", "title": "Write the monitoring plan", "action": "Name the metrics, the responsible parties, the review frequency and the escalation route. Cover functionality and behavior, comparison of outputs to known parameters, use case outcomes, confidence and data currency.", "evidence": "Monitoring plan with named metrics, owners and frequency.", "owner": "quality_safety_lead", "sources": ["N01", "N07", "N08", "N15", "J05", "E01", "E03", "E08", "H03", "I04", "R20"], "min_tier": "low", "status_q": "x_monitoring", "cadence": "monitoring"}, {"id": "O02", "phase": "operate", "title": "Scale monitoring frequency to risk", "action": "Monitor more often when the tool is close to a clinical decision. Administrative tools can be checked periodically.", "evidence": "Monitoring frequency recorded against the risk tier.", "owner": "quality_safety_lead", "sources": ["J06"], "min_tier": "low", "status_q": "x_monitoring", "cadence": "monitoring"}, {"id": "O03", "phase": "operate", "title": "Track intended versus actual performance", "action": "Track known and emergent risks using intended performance against performance in the deployed context. Document measurable improvements and declines.", "evidence": "Performance dashboard or periodic report.", "owner": "clinical_owner", "applies": {"any": [{"q": "affects_care", "eq": "yes"}, {"q": "patient_level", "eq": "yes"}]}, "sources": ["N10", "N11", "J05", "E03", "H05", "W02", "W06", "I09", "R20"], "min_tier": "moderate", "status_q": "x_monitoring", "cadence": "monitoring"}, {"id": "O04", "phase": "operate", "title": "Audit for bias during use", "action": "Monitor and audit for bias during use as well as before deployment. Report results to the governance group.", "evidence": "Periodic subgroup performance report.", "owner": "quality_safety_lead", "applies": {"any": [{"q": "patient_level", "eq": "yes"}, {"q": "affects_care", "eq": "yes"}]}, "sources": ["J11", "N09", "W05", "R13", "A09"], "min_tier": "moderate", "status_q": "x_subgroup", "cadence": "bias_audit"}, {"id": "O05", "phase": "operate", "title": "Open a channel for users to report problems and appeal outputs", "action": "Give end users and affected communities a way to report problems and appeal outcomes. Capture user input and overrides.", "evidence": "Reporting channel and appeal procedure.", "owner": "quality_safety_lead", "sources": ["N10", "N15", "H05", "R13"], "min_tier": "low", "status_q": "x_feedback"}, {"id": "O06", "phase": "operate", "title": "Report adverse events and errors", "action": "Report adverse events and ongoing errors to leadership and to the vendor. Record events in the internal incident system. Send locally found issues to the vendor.", "evidence": "Incident process that names the tool.", "owner": "quality_safety_lead", "sources": ["J08", "N16", "N05", "E08", "E09", "W04", "R10", "R11", "A11"], "min_tier": "low", "status_q": "x_incident"}, {"id": "O07", "phase": "operate", "title": "Provide a route for confidential external reporting", "action": "Set a process for confidential, blinded reporting of AI safety events to an independent organization. Designate who owns AI quality and safety.", "evidence": "Reporting procedure and designated owners.", "owner": "quality_safety_lead", "sources": ["J09", "I02", "R11"], "min_tier": "moderate", "status_q": "x_external"}, {"id": "O08", "phase": "operate", "title": "Prepare incident response and recovery", "action": "Follow procedures to respond to and recover from a previously unknown risk. Communicate incidents and errors to relevant parties, including affected communities. Record the response.", "evidence": "Incident response procedure and test or tabletop record.", "owner": "quality_safety_lead", "sources": ["N12", "N16", "N15", "E09", "R10", "A07", "A11"], "min_tier": "low", "status_q": "x_incident"}, {"id": "O09", "phase": "operate", "title": "Measure clinician workload from the tool", "action": "Count the tasks the tool adds for clinicians and review them with users. This item has no source clause. It is a local consideration.", "evidence": "Workload measure in the monitoring plan.", "owner": "clinical_owner", "applies": {"q": "workload", "eq": "yes"}, "sources": [], "sourced": false, "min_tier": "low", "status_q": "x_workload", "cadence": "monitoring"}, {"id": "O10", "phase": "operate", "title": "Record overrides and review disagreement", "action": "Log when users override or ignore the tool. Review the pattern for automation bias and for tool errors.", "evidence": "Override log and periodic review notes.", "owner": "quality_safety_lead", "applies": {"q": "autonomy", "in": ["recommends", "acts_with_review"]}, "min_tier": "moderate", "status_q": "x_override", "cadence": "monitoring", "sources": ["R09", "A06"]}, {"id": "O11", "phase": "operate", "title": "Control access and review audit logs", "action": "Limit access to the intended purpose. Keep audit trails of data access and model changes. Review them on a schedule.", "evidence": "Access list, audit log and review record.", "owner": "privacy_officer", "applies": {"q": "phi", "in": ["identifiable", "deidentified"]}, "min_tier": "moderate", "status_q": "x_auditlog", "cadence": "monitoring", "sources": ["R15", "A07"]}, {"id": "O12", "phase": "operate", "title": "Watch for drift and trigger revalidation", "action": "Track input data and performance against baseline. Set the drift level that triggers review or retraining. Check drift effects by subgroup.", "evidence": "Drift dashboard, trigger levels and review log.", "owner": "quality_safety_lead", "applies": {"any": [{"d": "changes_over_time"}, {"q": "model_type", "in": ["predictive", "generative", "agentic"]}]}, "min_tier": "moderate", "status_q": "x_drift", "cadence": "monitoring", "sources": ["R20", "A01", "A09"]}, {"id": "O14", "phase": "operate", "title": "Arrange independent review", "action": "Have a party outside the build or buy team review the tool and its monitoring. Share the findings with the governing group.", "evidence": "Independent review report.", "owner": "governance_lead", "min_tier": "high", "status_q": "x_independent", "cadence": "plan_review", "sources": ["R21", "R23"]}, {"id": "C01", "phase": "retire", "title": "Require vendor notice of changes and revalidate after them", "action": "Require the vendor to notify you of model changes or updates that may need an unplanned performance check. Revalidate after such changes.", "evidence": "Contract clause and a revalidation procedure.", "owner": "vendor_manager", "applies": {"all": [{"d": "vendor_supplied"}, {"q": "updates", "in": ["vendor_updates", "continuous"]}]}, "sources": ["J07", "N14", "I08", "F01", "F03", "A12"], "min_tier": "low", "status_q": "x_vendor_notice"}, {"id": "C02", "phase": "retire", "title": "Control change management for retraining and updates", "action": "Put local retraining, retuning and continuous learning under change management. Revalidate before a changed model is used.", "evidence": "Change control procedure for the tool.", "owner": "clinical_owner", "applies": {"q": "updates", "in": ["local_retrain", "continuous"]}, "sources": ["N15", "N14", "E06", "I04", "F01", "F02", "F03", "R14", "A07", "A12"], "min_tier": "low", "status_q": "x_vendor_notice"}, {"id": "C03", "phase": "retire", "title": "Set criteria and a mechanism to suspend or deactivate", "action": "Define the performance or outcome departures that trigger suspension. Assign who acts and how the tool is disengaged.", "evidence": "Suspension criteria and a tested disengage procedure.", "owner": "clinical_owner", "sources": ["N13", "N15", "H03"], "min_tier": "moderate", "status_q": "x_suspend"}, {"id": "C04", "phase": "retire", "title": "Plan decommissioning", "action": "Plan how the tool will be phased out safely without raising risk, including what replaces it and what happens to data.", "evidence": "Decommissioning plan.", "owner": "governance_lead", "sources": ["N02", "N15", "W06", "A08", "A10"], "min_tier": "moderate", "status_q": "x_decommission"}, {"id": "C05", "phase": "retire", "title": "Review the governance plan on a schedule", "action": "Plan periodic review of this governance plan and define the roles for it.", "evidence": "Scheduled review in the AI inventory.", "owner": "governance_lead", "sources": ["N01", "E07", "I09", "A08"], "min_tier": "low", "status_q": "x_plan_review", "cadence": "plan_review"}]}, "sources": {"note": "Rows were extracted by a language model from fetched text. Author review against the source PDFs is pending. Status draft means not independently checked.", "frameworks": {"nistairmf": {"name": "NIST AI Risk Management Framework 1.0", "short": "NIST AI RMF", "document": "NIST AI 100-1", "date": "2023-01", "url": "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf", "cite": "National Institute of Standards and Technology. Artificial Intelligence Risk Management Framework (AI RMF 1.0). NIST AI 100-1. 2023. https://doi.org/10.6028/NIST.AI.100-1"}, "jcchai": {"name": "Joint Commission and CHAI Guidance on the Responsible Use of AI in Healthcare", "short": "JC and CHAI RUAIH", "document": "Responsible Use of AI in Healthcare guidance", "date": "2025-09-17", "url": "https://digitalassets.jointcommission.org/api/public/content/dcfcf4f1a0cc45cdb526b3cb034c68c2", "cite": "The Joint Commission and Coalition for Health AI. Guidance on the Responsible Use of AI in Healthcare (RUAIH). 17 September 2025. https://digitalassets.jointcommission.org/api/public/content/dcfcf4f1a0cc45cdb526b3cb034c68c2"}, "euaiact": {"name": "EU Artificial Intelligence Act, high risk system requirements", "short": "EU AI Act", "document": "Regulation (EU) 2024/1689", "date": "2024-07", "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", "cite": "European Parliament and Council of the European Union. Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act). Official Journal of the European Union, 12 July 2024. https://eur-lex.europa.eu/eli/reg/2024/1689/oj"}, "onchti1": {"name": "ONC HTI-1 decision support intervention criterion", "short": "ONC HTI-1", "document": "45 CFR 170.315(b)(11)", "date": "2024-01", "url": "https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-D/part-170/subpart-C/section-170.315", "cite": "Office of the National Coordinator for Health Information Technology. Health Data, Technology, and Interoperability: Certification Program Updates, Algorithm Transparency, and Information Sharing (HTI-1) Final Rule. 89 Fed. Reg. 1192 (4 January 2024). 45 CFR 170.315(b)(11)."}, "who": {"name": "WHO Ethics and Governance of Artificial Intelligence for Health", "short": "WHO AI for health", "document": "WHO guidance", "date": "2021-06", "url": "https://iris.who.int/handle/10665/341996", "cite": "World Health Organization. Ethics and governance of artificial intelligence for health: WHO guidance. Geneva: WHO; 2021. https://iris.who.int/handle/10665/341996"}, "iso42001": {"name": "ISO/IEC 42001 Artificial intelligence management system", "short": "ISO/IEC 42001", "document": "ISO/IEC 42001:2023", "date": "2023-12", "url": "https://www.iso.org/standard/81230.html", "cite": "International Organization for Standardization and International Electrotechnical Commission. ISO/IEC 42001:2023 Information technology, Artificial intelligence, Management system. 2023. https://www.iso.org/standard/81230.html"}, "fdapccp": {"name": "FDA Predetermined Change Control Plan guidance for AI enabled device software", "short": "FDA PCCP", "document": "FDA guidance", "date": "2024-12", "url": "https://www.fda.gov/media/166704/download", "cite": "U.S. Food and Drug Administration. Marketing Submission Recommendations for a Predetermined Change Control Plan for Artificial Intelligence-Enabled Device Software Functions. Guidance for Industry and FDA Staff. 2024. https://www.fda.gov/media/166704/download"}, "chairag": {"name": "CHAI Responsible AI Guide", "short": "CHAI Responsible AI Guide", "document": "Responsible AI Guide", "date": "see source", "url": "https://assets.ctfassets.net/7s4afyr9pmov/6e7PrdrsNTQ5FjZ4uyRjTW/c4070131c523d4e1db26105aa51f087d/CHAI_Responsible-AI-Guide.pdf", "cite": "Coalition for Health AI. Responsible AI Guide. https://assets.ctfassets.net/7s4afyr9pmov/6e7PrdrsNTQ5FjZ4uyRjTW/c4070131c523d4e1db26105aa51f087d/CHAI_Responsible-AI-Guide.pdf"}, "chaiasg": {"name": "CHAI Assurance Standards Guide", "short": "CHAI Assurance Standards", "document": "Assurance Standards Guide (draft)", "date": "2024-06 draft", "url": "https://www.chai.org/blog/chai-releases-draft-responsible-health-ai-framework-for-public-comment", "cite": "Coalition for Health AI. Assurance Standards Guide (draft for public comment, June 2024). https://www.chai.org/blog/chai-releases-draft-responsible-health-ai-framework-for-public-comment"}, "chaiamc": {"name": "CHAI Applied Model Card", "short": "CHAI Applied Model Card", "document": "Applied Model Card documentation v0.1", "date": "v0.1", "url": "https://registry.chai.org/applied-model-card", "cite": "Coalition for Health AI. Applied Model Card, documentation v0.1. https://mc.chai.org/v0.1/documentation.pdf ; template and schema at https://github.com/coalition-for-health-ai/mc-schema"}}, "controls": [{"id": "N01", "framework": "nistairmf", "clause": "GOVERN 1.5", "requirement": "Plan ongoing monitoring and periodic review of the risk process, define roles, and set the review frequency.", "status": "draft"}, {"id": "N02", "framework": "nistairmf", "clause": "GOVERN 1.7", "requirement": "Have processes for decommissioning and phasing out AI systems safely, without raising risk.", "status": "draft"}, {"id": "N03", "framework": "nistairmf", "clause": "GOVERN 2.1 and 2.3", "requirement": "Document roles, responsibilities and lines of communication. Executive leadership owns decisions on AI risk.", "status": "draft"}, {"id": "N04", "framework": "nistairmf", "clause": "GOVERN 3.2", "requirement": "Define and differentiate roles for human and AI configurations and for oversight of AI systems.", "status": "draft"}, {"id": "N05", "framework": "nistairmf", "clause": "GOVERN 4.3", "requirement": "Enable AI testing, incident identification and information sharing.", "status": "draft"}, {"id": "N06", "framework": "nistairmf", "clause": "GOVERN 6.1 and 6.2", "requirement": "Address third party AI risks by policy. Have contingency processes for failures or incidents in high risk third party data or AI.", "status": "draft"}, {"id": "N07", "framework": "nistairmf", "clause": "MEASURE 2.4", "requirement": "Monitor the functionality and behavior of the AI system and its components in production.", "status": "draft"}, {"id": "N08", "framework": "nistairmf", "clause": "MEASURE 2.6", "requirement": "Evaluate safety regularly. Safety metrics reflect reliability, robustness, real time monitoring and response times for AI system failures.", "status": "draft"}, {"id": "N09", "framework": "nistairmf", "clause": "MEASURE 2.11", "requirement": "Evaluate and document fairness and bias.", "status": "draft"}, {"id": "N10", "framework": "nistairmf", "clause": "MEASURE 3.1 and 3.3", "requirement": "Track known and emergent risks regularly using intended versus actual performance in deployed contexts. Give end users and affected communities channels to report problems and appeal outcomes.", "status": "draft"}, {"id": "N11", "framework": "nistairmf", "clause": "MEASURE 4.2 and 4.3", "requirement": "Validate performance in the deployment context with domain experts. Identify and document measurable performance improvements or declines.", "status": "draft"}, {"id": "N12", "framework": "nistairmf", "clause": "MANAGE 2.3", "requirement": "Follow procedures to respond to and recover from a previously unknown risk.", "status": "draft"}, {"id": "N13", "framework": "nistairmf", "clause": "MANAGE 2.4", "requirement": "Have mechanisms, with assigned and understood responsibilities, to supersede, disengage or deactivate systems whose performance or outcomes depart from intended use.", "status": "draft"}, {"id": "N14", "framework": "nistairmf", "clause": "MANAGE 3.1 and 3.2", "requirement": "Monitor third party resources and pre trained models regularly. Apply and document risk controls.", "status": "draft"}, {"id": "N15", "framework": "nistairmf", "clause": "MANAGE 4.1", "requirement": "Implement post deployment monitoring plans. They cover user input capture, appeal and override, decommissioning, incident response, recovery and change management.", "status": "draft"}, {"id": "N16", "framework": "nistairmf", "clause": "MANAGE 4.3", "requirement": "Communicate incidents and errors to relevant AI actors, including affected communities. Track, respond to and recover from incidents, and document this.", "status": "draft"}, {"id": "J01", "framework": "jcchai", "clause": "Element 1, leadership", "requirement": "Appoint individuals with technology expertise to lead AI use. Include a multidisciplinary team spanning executive, compliance, IT, safety, clinical, cybersecurity, privacy and stakeholder roles.", "status": "draft"}, {"id": "J02", "framework": "jcchai", "clause": "Element 1, policy and board", "requirement": "Policies cover selection through lifecycle management and equitable use. The governing board receives regular updates on use, outcomes and adverse events.", "status": "draft"}, {"id": "J03", "framework": "jcchai", "clause": "Element 3, data use agreements", "requirement": "Vendor data agreements define permitted uses, prohibit re identification, require security compliance and reserve audit rights with penalties.", "status": "draft"}, {"id": "J04", "framework": "jcchai", "clause": "Element 4, pre deployment requests", "requirement": "Ask vendors how the tool was validated and tested, whether they will tune or validate on a deployment representative sample, and how bias was evaluated.", "status": "draft"}, {"id": "J05", "framework": "jcchai", "clause": "Element 4, monitoring policy", "requirement": "Write policies naming responsible parties for regular validation, comparison of outputs to known parameters, checks of use case outcomes and confidence, confirmation of data currency, and an AI dashboard.", "status": "draft"}, {"id": "J06", "framework": "jcchai", "clause": "Element 4, risk based frequency", "requirement": "Monitor more often for tools close to clinical decisions. Administrative tools can be checked periodically.", "status": "draft"}, {"id": "J07", "framework": "jcchai", "clause": "Element 4, vendor feedback", "requirement": "Establish channels with vendors. Vendors notify the health system of model changes or updates that may need an unplanned performance check. Locally found issues go to vendors.", "status": "draft"}, {"id": "J08", "framework": "jcchai", "clause": "Element 4, adverse event reporting", "requirement": "Create a process to report adverse events or ongoing errors to leadership and vendors.", "status": "draft"}, {"id": "J09", "framework": "jcchai", "clause": "Element 5, voluntary blinded reporting", "requirement": "Have a process for confidential, blinded reporting of AI safety events to an independent organization. Record events in internal incident systems. Designated individuals own AI quality and safety.", "status": "draft"}, {"id": "J10", "framework": "jcchai", "clause": "Element 6, risk and bias process", "requirement": "Identify, categorize and document prospective and observed risks and biases, especially safety and access risks. Use model cards.", "status": "draft"}, {"id": "J11", "framework": "jcchai", "clause": "Element 6, local validation and ongoing bias checks", "requirement": "Check that tool testing covers the populations served. Tune or test on local data. Monitor and audit for bias before deployment and during use.", "status": "draft"}, {"id": "J12", "framework": "jcchai", "clause": "Element 7, education and training", "requirement": "Provide role specific training and documentation. Define who may use each tool. Decide when training is needed before rollout and whether it must recur.", "status": "draft"}, {"id": "J13", "framework": "jcchai", "clause": "Element 2, patient privacy and transparency", "requirement": "Protect patient data from unauthorized use or release. Disclose and educate patients and families on AI use. Notify patients when AI directly affects their care and how their data are used. Obtain consent where and when relevant. Policies address transparency for staff and patients.", "status": "draft"}, {"id": "E01", "framework": "euaiact", "clause": "Article 9, risk management system", "requirement": "Run a continuous risk management process across the lifecycle. Identify known and foreseeable risks, estimate them, adopt mitigation and test.", "status": "draft"}, {"id": "E02", "framework": "euaiact", "clause": "Article 10, data and data governance", "requirement": "Govern training, validation and test data. Examine data for bias and gaps relevant to the intended population.", "status": "draft"}, {"id": "E03", "framework": "euaiact", "clause": "Article 12, record keeping", "requirement": "Log events automatically over the system lifetime so operation can be traced and monitored.", "status": "draft"}, {"id": "E04", "framework": "euaiact", "clause": "Article 13, transparency and information to deployers", "requirement": "Supply instructions that state intended purpose, accuracy, known limits and oversight measures.", "status": "draft"}, {"id": "E05", "framework": "euaiact", "clause": "Article 14, human oversight", "requirement": "Design for effective oversight by people who can understand outputs, override them and stop the system.", "status": "draft"}, {"id": "E06", "framework": "euaiact", "clause": "Article 15, accuracy, robustness and cybersecurity", "requirement": "Declare accuracy levels. Keep performance robust and resilient to errors, faults and attacks.", "status": "draft"}, {"id": "E07", "framework": "euaiact", "clause": "Article 17, quality management system", "requirement": "Keep documented procedures for compliance, change management, testing, monitoring and accountability.", "status": "draft"}, {"id": "E08", "framework": "euaiact", "clause": "Article 26, obligations of deployers", "requirement": "Use the system per instructions, assign oversight to competent staff, monitor operation, keep logs and report problems.", "status": "draft"}, {"id": "E09", "framework": "euaiact", "clause": "Articles 72 and 73, post market monitoring and serious incident reporting", "requirement": "Collect and analyze performance data after release. Report serious incidents to the authority without delay.", "status": "draft"}, {"id": "H01", "framework": "onchti1", "clause": "170.315(b)(11), source attributes", "requirement": "Make intervention source attributes available to users: origin, funding, release dates, inputs used and how it was validated.", "status": "draft"}, {"id": "H02", "framework": "onchti1", "clause": "170.315(b)(11), risk analysis", "requirement": "Analyze risks to validity, reliability, robustness, fairness, intelligibility, safety, security and privacy for predictive tools.", "status": "draft"}, {"id": "H03", "framework": "onchti1", "clause": "170.315(b)(11), risk mitigation", "requirement": "Put documented practices in place to mitigate the risks found in the analysis.", "status": "draft"}, {"id": "H04", "framework": "onchti1", "clause": "170.315(b)(11), governance", "requirement": "Set policies and controls for how data are acquired, managed and used by the tool.", "status": "draft"}, {"id": "H05", "framework": "onchti1", "clause": "170.315(b)(11), feedback and export", "requirement": "Let users give feedback on outputs and export it in computable form with the action taken.", "status": "draft"}, {"id": "W01", "framework": "who", "clause": "Principle 1, protect human autonomy", "requirement": "Keep humans in control of health decisions. Protect privacy and obtain valid consent.", "status": "draft"}, {"id": "W02", "framework": "who", "clause": "Principle 2, promote well being, safety and the public interest", "requirement": "Meet regulatory requirements for safety, accuracy and efficacy. Apply quality control in practice.", "status": "draft"}, {"id": "W03", "framework": "who", "clause": "Principle 3, transparency, explainability and intelligibility", "requirement": "Publish enough information before deployment so the tool can be understood, debated and challenged.", "status": "draft"}, {"id": "W04", "framework": "who", "clause": "Principle 4, responsibility and accountability", "requirement": "Name who is responsible. Provide appropriate mechanisms for questioning and redress.", "status": "draft"}, {"id": "W05", "framework": "who", "clause": "Principle 5, inclusiveness and equity", "requirement": "Design and use for the widest appropriate access. Monitor for bias and unequal performance.", "status": "draft"}, {"id": "W06", "framework": "who", "clause": "Principle 6, responsive and sustainable", "requirement": "Assess responsiveness during real use. Plan for sustainability and for retirement of tools that no longer perform.", "status": "draft"}, {"id": "I01", "framework": "iso42001", "clause": "Clause 5, leadership and AI policy", "requirement": "Top management sets an AI policy, assigns roles and commits resources.", "status": "draft"}, {"id": "I02", "framework": "iso42001", "clause": "Annex A.3, internal organization", "requirement": "Define roles and responsibilities. Provide a process to report concerns.", "status": "draft"}, {"id": "I03", "framework": "iso42001", "clause": "Annex A.5, assessing impacts of AI systems", "requirement": "Assess impacts on individuals and groups, document results and keep them current.", "status": "draft"}, {"id": "I04", "framework": "iso42001", "clause": "Annex A.6, AI system life cycle", "requirement": "Set objectives, verification and validation criteria, deployment and operation controls, monitoring and change handling.", "status": "draft"}, {"id": "I05", "framework": "iso42001", "clause": "Annex A.7, data for AI systems", "requirement": "Document data acquisition, quality, provenance and preparation.", "status": "draft"}, {"id": "I06", "framework": "iso42001", "clause": "Annex A.8, information for interested parties", "requirement": "Provide user documentation, incident communication and reporting channels.", "status": "draft"}, {"id": "I07", "framework": "iso42001", "clause": "Annex A.9, use of AI systems", "requirement": "Define responsible use processes, objectives and intended use.", "status": "draft"}, {"id": "I08", "framework": "iso42001", "clause": "Annex A.10, third party and customer relationships", "requirement": "Allocate responsibilities with suppliers and customers. Assess supplier risk.", "status": "draft"}, {"id": "I09", "framework": "iso42001", "clause": "Clauses 9 and 10, performance evaluation and improvement", "requirement": "Monitor, audit and review the management system. Correct nonconformity and improve.", "status": "draft"}, {"id": "F01", "framework": "fdapccp", "clause": "Description of modifications", "requirement": "State the planned changes to the AI function that will be made after release.", "status": "draft"}, {"id": "F02", "framework": "fdapccp", "clause": "Modification protocol", "requirement": "Define data handling, retraining, performance evaluation and update procedures for each planned change.", "status": "draft"}, {"id": "F03", "framework": "fdapccp", "clause": "Impact assessment", "requirement": "Assess benefits and risks of each modification and how risks are mitigated.", "status": "draft"}, {"id": "R01", "framework": "chairag", "clause": "Stage 1, usefulness", "requirement": "Justify why AI addresses the problem and why it beats non AI alternatives. Complete a risk benefit and cost benefit analysis.", "status": "draft"}, {"id": "R02", "framework": "chairag", "clause": "Stage 1, usefulness", "requirement": "Assess workflow integration, including the effect on patient clinician interaction.", "status": "draft"}, {"id": "R03", "framework": "chairag", "clause": "Stage 1, fairness", "requirement": "Define fairness for the use case. Identify subgroups at risk. Set a bias monitoring and mitigation strategy.", "status": "draft"}, {"id": "R04", "framework": "chairag", "clause": "Stage 1, fairness and security", "requirement": "For acquired tools, ask the vendor for subgroup performance and parity data. Review third party security practices.", "status": "draft"}, {"id": "R05", "framework": "chairag", "clause": "Stage 1, transparency", "requirement": "Document intended use, users and target population with inclusion and exclusion criteria. Choose a documentation format such as a model card.", "status": "draft"}, {"id": "R06", "framework": "chairag", "clause": "Stage 1, security and privacy", "requirement": "Keep an AI systems inventory with data processing maps. Run an initial privacy and security risk assessment.", "status": "draft"}, {"id": "R07", "framework": "chairag", "clause": "Stage 1, safety", "requirement": "Confirm regulatory and ethical requirements: FDA software criteria, IRB need, consent and adverse event disclosure.", "status": "draft"}, {"id": "R08", "framework": "chairag", "clause": "Stage 2, usefulness", "requirement": "Assess usability with human factors methods. Document robustness testing.", "status": "draft"}, {"id": "R09", "framework": "chairag", "clause": "Stage 2, safety", "requirement": "Let end users control, direct and override recommendations. Record each override.", "status": "draft"}, {"id": "R10", "framework": "chairag", "clause": "Stage 2, safety", "requirement": "Write a risk management plan with adverse events, causes and corrective actions. Define adverse and serious adverse events.", "status": "draft"}, {"id": "R11", "framework": "chairag", "clause": "Stage 2, safety", "requirement": "Set reporting and recall procedures and a threshold for reporting potential patient harm. Share concerns with the developer and regulators.", "status": "draft"}, {"id": "R12", "framework": "chairag", "clause": "Stage 2, transparency", "requirement": "Label the model in plain language: development, purpose, limits, error rates and underrepresented subpopulations. Update the label when new limits appear.", "status": "draft"}, {"id": "R13", "framework": "chairag", "clause": "Stage 2, fairness", "requirement": "Provide simple channels for end user feedback on bias. Review feedback in time to stop escalation.", "status": "draft"}, {"id": "R14", "framework": "chairag", "clause": "Stage 2, accountability", "requirement": "Set a governance structure and a change management plan that split developer and implementer duties. Define how the teams communicate.", "status": "draft"}, {"id": "R15", "framework": "chairag", "clause": "Stage 2, security and privacy", "requirement": "Set data governance: access controls, secure transfer, encryption, audit trails, retention, third party sharing terms and incident response.", "status": "draft"}, {"id": "R16", "framework": "chairag", "clause": "Stage 3, engineering", "requirement": "Follow a data management plan. Use quality assured data with documented lineage that represents the target population. Test robustness across populations.", "status": "draft"}, {"id": "R17", "framework": "chairag", "clause": "Stage 4, assess", "requirement": "Run installation qualification and local validation. Run a prospective silent evaluation.", "status": "draft"}, {"id": "R18", "framework": "chairag", "clause": "Stage 4, assess", "requirement": "Train end users. Name the business owner accountable for testing. Approve implementation, measurement and mitigation plans before the pilot.", "status": "draft"}, {"id": "R19", "framework": "chairag", "clause": "Stage 5, pilot", "requirement": "Pilot first. Assess real world impact, workflow fit, acceptance and downstream effects. Update the risk plan. Decide on scale up from set success criteria.", "status": "draft"}, {"id": "R20", "framework": "chairag", "clause": "Stage 6, deploy and monitor", "requirement": "Monitor continuously. Audit regularly. Watch for drift. Set retraining procedures. Document all changes and share findings.", "status": "draft"}, {"id": "R21", "framework": "chairag", "clause": "Governance foundation", "requirement": "Assign roles by SOP. Place oversight high enough to decide on resources, incidents and rollback. Provide independent review and train staff.", "status": "draft"}, {"id": "R22", "framework": "chairag", "clause": "Stakeholder roles", "requirement": "Name a business owner, a technology owner and an executive sponsor. Give end users a route to report risks.", "status": "draft"}, {"id": "R23", "framework": "chairag", "clause": "Independent review", "requirement": "Arrange independent review for objectivity. Share results to build trust.", "status": "draft"}, {"id": "A01", "framework": "chaiasg", "clause": "Stage 3, usefulness", "requirement": "Check that training data match the deployment setting and that local data represent the population. Monitor data quality and drift.", "status": "draft"}, {"id": "A02", "framework": "chaiasg", "clause": "Stage 3, fairness", "requirement": "Justify any use of protected attributes. Check proxies and composite scores for hidden bias.", "status": "draft"}, {"id": "A03", "framework": "chaiasg", "clause": "Stage 3, transparency", "requirement": "Document data provenance, lineage and limits. Version control the datasets.", "status": "draft"}, {"id": "A04", "framework": "chaiasg", "clause": "Stage 4, fairness", "requirement": "Keep training and test data independent. Assess performance and parity across subgroups.", "status": "draft"}, {"id": "A05", "framework": "chaiasg", "clause": "Stage 4, security", "requirement": "Assess third party providers. Keep audit records and system documentation. Set up vulnerability reporting.", "status": "draft"}, {"id": "A06", "framework": "chaiasg", "clause": "Stage 5, transparency", "requirement": "Reduce automation bias. Manage clinician disagreement with outputs. Assess what users do after an AI interaction.", "status": "draft"}, {"id": "A07", "framework": "chaiasg", "clause": "Stage 5, security", "requirement": "Run configuration change control. Review audit logs. Keep an incident response plan. Set resilience needs for critical AI services.", "status": "draft"}, {"id": "A08", "framework": "chaiasg", "clause": "Stage 5 and 6, safety", "requirement": "Review regularly whether the system is still relevant or obsolete.", "status": "draft"}, {"id": "A09", "framework": "chaiasg", "clause": "Stage 6, fairness", "requirement": "Monitor drift effects on bias. Name who monitors bias. Assess drift risk between pilot and full deployment.", "status": "draft"}, {"id": "A10", "framework": "chaiasg", "clause": "Stage 6, transparency", "requirement": "Tell patients and affected groups about the AI role. Make end of life processes clear.", "status": "draft"}, {"id": "A11", "framework": "chaiasg", "clause": "Stage 6, security", "requirement": "Notify stakeholders of cybersecurity and privacy incidents. Report unintended uses. Assure the supply chain.", "status": "draft"}, {"id": "A12", "framework": "chaiasg", "clause": "Stage 6, safety", "requirement": "Confirm updates keep the system safe and effective. Analyze impact on safety and benefit.", "status": "draft"}, {"id": "A13", "framework": "chaiasg", "clause": "Governance principle", "requirement": "Provide high level oversight, a bias management structure with clear roles, and mandatory training on ethics, quality, intended use and risks.", "status": "draft"}, {"id": "A14", "framework": "chaiasg", "clause": "Stage 2, fairness and transparency", "requirement": "Define clear decision thresholds. Provide explainability measures for subgroup assessment.", "status": "draft"}, {"id": "M01", "framework": "chaiamc", "clause": "Header", "requirement": "Record name, developer, contact for issues, release stage, release date, version, global availability and regulatory approval.", "status": "draft"}, {"id": "M02", "framework": "chaiamc", "clause": "Uses and directions", "requirement": "State intended use and workflow, primary users, how to use, target population and cautioned out of scope settings.", "status": "draft"}, {"id": "M03", "framework": "chaiamc", "clause": "Warnings", "requirement": "State known risks and limitations, known biases and ethical considerations, and the clinical risk level.", "status": "draft"}, {"id": "M04", "framework": "chaiamc", "clause": "Trust ingredients, AI system facts", "requirement": "State outputs, model type, foundation models, input data, development data, bias mitigation, maintenance, security practices and transparency mechanisms.", "status": "draft"}, {"id": "M05", "framework": "chaiamc", "clause": "Transparency information", "requirement": "State the funding source, third party information and stakeholders consulted.", "status": "draft"}, {"id": "M06", "framework": "chaiamc", "clause": "Key metrics, usefulness, usability and efficacy", "requirement": "Report goal, result, interpretation, test type, test data and validation process.", "status": "draft"}, {"id": "M07", "framework": "chaiamc", "clause": "Key metrics, fairness and equity", "requirement": "Report the same six metric fields for fairness and equity.", "status": "draft"}, {"id": "M08", "framework": "chaiamc", "clause": "Key metrics, safety and reliability", "requirement": "Report the same six metric fields for safety and reliability.", "status": "draft"}, {"id": "M09", "framework": "chaiamc", "clause": "Resources", "requirement": "List evaluation references, clinical trials, publications, reimbursement status and patient consent or disclosure.", "status": "draft"}]}, "disclaimer": "This plan maps your answers to requirements in published governance documents. Medon is a planning aid that supports your governance committee and counsel. Each mapping to a source document carries a review status.", "report": {"css": ":root{--bg:#fff;--card:#fff;--fg:#16191d;--mut:#5d6570;--line:#e3e6ea;--cu:#c4501a;--lo:#2c8a6e;--mo:#c98a12;--hi:#c2462b;--done:#2c8a6e;--prog:#c98a12;--open:#c2462b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}\n.pg{max-width:980px;margin:0 auto;padding:22px 18px 40px}.mono{font:11px ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}\nh1{font-size:22px;margin:4px 0 6px;letter-spacing:-.01em}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.tier{padding:3px 12px;border-radius:999px;color:#fff;font:600 12px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em}.tier.high{background:var(--hi)}.tier.moderate{background:var(--mo);color:#1a1a1a}.tier.low{background:var(--lo)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);background:var(--card)}\n.viz{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;margin:16px 0}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.box h3{margin:0 0 6px;font:11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:500}\n
